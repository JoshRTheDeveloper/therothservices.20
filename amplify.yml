version: 1
# Marketing site does not use Cognito/AppSync on the frontend.
# Skip pipeline-deploy for now — backend CF updates were failing
# (AmplifyBranchLinker + data nested stack). Re-enable when picks auth ships.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
