version: 1
applications:
  # NFL Picks PWA — full stack (Cognito + AppSync + hosted frontend)
  - appRoot: apps/picks
    backend:
      phases:
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR" && npm install --cache .npm --prefer-offline && npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir apps/picks
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
            - test -d dist
            - rm -rf "$CODEBUILD_SRC_DIR/dist"
            - cp -R dist "$CODEBUILD_SRC_DIR/dist"
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  # Marketing site — frontend only (no Cognito/AppSync on this app)
  - appRoot: "."
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
