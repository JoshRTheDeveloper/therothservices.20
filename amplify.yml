version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        # npm ci fails on this repo's lockfile (nested AWS SDK deps out of sync).
        # npm install is the reliable path for Amplify Hosting Gen 2 builds.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
