version: 1
applications:
  # NFL Picks PWA — full stack (Cognito + AppSync + hosted frontend)
  - appRoot: apps/picks
    backend:
      phases:
        build:
          commands:
            # Subshell so cd does not leak into the frontend phase
            - |
              set -e
              ( cd ../.. && npm install --cache .npm --prefer-offline && npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --outputs-out-dir apps/picks )
    frontend:
      phases:
        preBuild:
          commands:
            - |
              set -e
              if [ -f ../../amplify/backend.ts ]; then
                npm install --cache .npm --prefer-offline
              else
                cd apps/picks
                npm install --cache .npm --prefer-offline
              fi
        build:
          commands:
            - |
              set -e
              if [ -f ../../amplify/backend.ts ]; then
                npm run build
              else
                cd apps/picks
                npm run build
              fi
              test -d dist
              test -f dist/index.html
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../.npm/**/*
          - ../../node_modules/**/*

  # Marketing site — frontend only (no Cognito/AppSync on this app)
  - appRoot: "."
    frontend:
      phases:
        preBuild:
          commands:
            - npm install --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
